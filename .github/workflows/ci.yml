name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Show runtime
        run: node -e "console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch}))"
      # The first pwsh launch on a fresh runner can take longer than a test deadline.
      - name: Warm up PowerShell
        shell: bash
        run: if command -v pwsh >/dev/null; then time pwsh -NoLogo -NoProfile -NonInteractive -Command "Write-Output ready"; fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check
        run: npm run check
      - name: Package smoke test
        run: npm run test:package
